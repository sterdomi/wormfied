<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGradCannon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="45%" stop-color="#ff9e00"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>
    <radialGradient id="glowCannon" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ff9e00" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff9e00" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <circle cx="30" cy="30" r="28" fill="url(#glowCannon)"/>

  <!-- Kristall (Diamant-Form) -->
  <polygon points="30,4 50,24 40,54 20,54 10,24"
           fill="url(#crystalGradCannon)" stroke="#9d0208" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,4 50,24 30,30 10,24"
           fill="#ffffff" opacity="0.25"/>

  <!-- Fadenkreuz-Symbol -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <circle cx="30" cy="33" r="9" fill="none"/>
    <line x1="30" y1="18" x2="30" y2="24"/>
    <line x1="30" y1="42" x2="30" y2="48"/>
    <line x1="15" y1="33" x2="21" y2="33"/>
    <line x1="39" y1="33" x2="45" y2="33"/>
  </g>
</svg>
