<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGradSpeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#caf0f8"/>
      <stop offset="45%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <radialGradient id="glowSpeed" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#48cae4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <circle cx="30" cy="30" r="28" fill="url(#glowSpeed)"/>

  <!-- Kristall (Diamant-Form) -->
  <polygon points="30,4 50,24 40,54 20,54 10,24"
           fill="url(#crystalGradSpeed)" stroke="#023e8a" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,4 50,24 30,30 10,24"
           fill="#ffffff" opacity="0.25"/>

  <!-- Blitz-Symbol -->
  <polygon points="33,14 21,33 28,33 24,48 40,26 32,26" fill="#ffffff" stroke="#023e8a" stroke-width="1"/>
</svg>
