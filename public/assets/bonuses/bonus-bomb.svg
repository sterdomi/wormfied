<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crystalGradBomb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c4fb"/>
      <stop offset="45%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <radialGradient id="glowBomb" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#c77dff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0.4"/>
