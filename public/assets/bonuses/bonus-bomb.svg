  <polygon points="30,4 50,24 30,30 10,24"
           fill="#ffffff" opacity="0.25"/>

  <!-- Explosions-Stern-Symbol -->
  <path d="M30,14 L34,25 L46,25 L36,32 L40,44 L30,37 L20,44 L24,32 L14,25 L26,25 Z"
        fill="#ffffff" stroke="#5a189a" stroke-width="1" stroke-linejoin="round"/>
