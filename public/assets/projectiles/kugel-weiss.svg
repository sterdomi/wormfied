<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e6e6ea"/>
      <stop offset="80%" stop-color="#b7b7c2"/>
      <stop offset="100%" stop-color="#7d7d8a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#eaeaf0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#eaeaf0" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- äusseres Glühen -->
  <circle cx="20" cy="20" r="19" fill="url(#glow)"/>

  <!-- Kugelkörper -->
  <circle cx="20" cy="20" r="13" fill="url(#ballGrad)" stroke="#4a4a54" stroke-width="1"/>

  <!-- Glanzpunkt -->
  <ellipse cx="16" cy="15" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.85"/>
</svg>
