<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#ffd60a"/>
      <stop offset="80%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#c1440e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffd60a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd60a" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- äusseres Glühen -->
  <circle cx="20" cy="20" r="19" fill="url(#glow)"/>

  <!-- Kugelkörper -->
  <circle cx="20" cy="20" r="13" fill="url(#ballGrad)" stroke="#8a3a00" stroke-width="1"/>

  <!-- Glanzpunkt -->
  <ellipse cx="16" cy="15" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.85"/>
</svg>
