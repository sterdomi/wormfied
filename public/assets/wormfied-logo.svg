<svg viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="45" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="35%" stop-color="#40916c"/>
      <stop offset="75%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#0d2818"/>
    </linearGradient>
    <linearGradient id="titleHighlight" x1="0" y1="45" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="titleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="ballLightningGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#ffd60a"/>
      <stop offset="80%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#c1440e"/>
    </radialGradient>
    <radialGradient id="ballLightningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#ffd60a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffd60a" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- Titel-Schriftzug: Buchstaben manuell positioniert, 'o' ausgelassen (Platz fuer Marienkaefer),
       'i' punktlos / dotless (Platz fuer Mini-Spinne als Punkt-Ersatz) -->
  <text y="120" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
        font-weight="900" font-style="italic" font-size="92" letter-spacing="2"
        fill="url(#titleGrad)" stroke="#0a1a12" stroke-width="6"
        paint-order="stroke fill" filter="url(#titleShadow)">
    <tspan x="90">W</tspan><tspan x="221.75">r</tspan><tspan x="276.25">m</tspan><tspan x="364.75">f</tspan><tspan x="421.25">ı</tspan><tspan x="459">e</tspan><tspan x="519.5">d</tspan>
  </text>

  <text y="120" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
        font-weight="900" font-style="italic" font-size="92" letter-spacing="2"
        fill="url(#titleHighlight)">
    <tspan x="90">W</tspan><tspan x="221.75">r</tspan><tspan x="276.25">m</tspan><tspan x="364.75">f</tspan><tspan x="421.25">ı</tspan><tspan x="459">e</tspan><tspan x="519.5">d</tspan>
  </text>

  <!-- Marienkaefer anstelle des 'o' -->
  <image href="data:image/svg+xml;base64," x="158" y="56.75" width="74" height="74"/>

  <!-- Mini-Spinne anstelle des i-Punkts, haengt an kurzem Faden -->
  <line x1="440" y1="20" x2="440" y2="36" stroke="#e8ede3" stroke-width="2" opacity="0.95"/>
  <image href="data:image/svg+xml;base64," x="425" y="36" width="30" height="30"/>

  <!-- Rankenartige Unterstreichung -->
  <path d="M70,140 C160,155 260,150 320,150 C380,150 480,155 570,140"
        fill="none" stroke="#52b788" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="70" cy="140" r="4" fill="#52b788"/>
  <circle cx="570" cy="140" r="4" fill="#52b788"/>

  <!-- Kugelblitz auf der Unterstreichung -->
  <g transform="translate(320,150)">
    <circle r="14" fill="url(#ballLightningGlow)"/>
    <circle r="8" fill="url(#ballLightningGrad)" stroke="#8a3a00" stroke-width="0.8"/>
    <path d="M1,-6 L-4,1 L0,1 L-1,6 L4,-1 L0,-1 Z" fill="#fff9c4"/>
  </g>
</svg>
